version: '3.9'

services:
  # ─── PostgreSQL Database ───────────────
  postgres:
    image: postgres:15-alpine
    container_name: barq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barq_user
      POSTGRES_PASSWORD: barq_password
      POSTGRES_DB: barq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barq_user -d barq_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barq_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://barq_user:barq_password@postgres:5432/barq_db?schema=public
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
    driver: local
